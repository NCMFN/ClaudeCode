<title>Roots – Family Tree Demo</title>
<style>
:root{--bg:#EEF1EC;--card:#fff;--ink:#1C2B27;--muted:#5E6F69;--pine:#2F5D50;--gold:#C79A3B;--line:#B9C6BF;--sheet:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111916;--card:#1B2622;--ink:#E8EFEB;--muted:#93A59D;--pine:#6FB39F;--gold:#E0B45A;--line:#33453E;--sheet:#1B2622}}
:root[data-theme="dark"]{--bg:#111916;--card:#1B2622;--ink:#E8EFEB;--muted:#93A59D;--pine:#6FB39F;--gold:#E0B45A;--line:#33453E;--sheet:#1B2622}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.serif{font-family:"Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);margin:2px 0 0}
.plan{max-width:760px;margin:12px auto;padding:0 16px}
.plan div{display:flex;justify-content:space-between;align-items:center;gap:12px;border:1px solid var(--gold);border-radius:12px;padding:10px 14px;background:var(--card)}
.plan b{display:block;font-size:14px}.plan span{font-size:13px;color:var(--muted)}
.plan button{flex:none}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--pine);background:var(--pine);color:#fff;padding:8px 14px}
button.ghost{background:transparent;color:var(--pine)}
:root[data-theme="dark"] button:not(.ghost),:root:not([data-theme="light"]) button:not(.ghost){color:#0E1512}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.p:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:4px 16px 96px}
.gen{margin-top:22px;position:relative}
.gen h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 8px}
.row{display:flex;flex-wrap:wrap;gap:14px}
.unit{display:flex;gap:0;border-top:3px solid var(--gold);padding-top:8px;position:relative}
.unit::before{content:"";position:absolute;top:-3px;left:50%;height:0}
.p{position:relative;width:118px;text-align:center;background:var(--card);color:var(--ink);border:1px solid var(--line);padding:10px 6px;margin-right:6px;border-radius:10px}
.p:last-child{margin-right:0}
.p .n{display:block;font-size:15px;line-height:1.2;margin-top:6px}
.p .y{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.av{display:block;margin:0 auto;border-radius:50%;overflow:hidden;background:var(--bg);width:52px;height:52px}
.av svg,.av img{display:block;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:2px;right:2px;width:16px;height:16px;line-height:16px;border-radius:50%;background:var(--gold);color:#2A1F06;font-size:10px;text-align:center;pointer-events:none}
.origline{font-size:13px;color:var(--muted);margin:2px 0 0}
.top{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.top .av{width:84px;height:84px;flex:none;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:4px 10px;font-size:13px}
.up{font-size:13px;color:var(--pine);background:none;border:0;padding:0;margin:6px 0 0;text-decoration:underline}
.p.me{border-color:var(--pine);border-width:2px}
.p.new{animation:pop .4s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
@media (prefers-reduced-motion:reduce){.p.new{animation:none}}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center}
.bar button{flex:1;max-width:340px}
.stats{color:var(--muted);font-size:13px;margin:14px 0 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.panel{background:var(--sheet);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
.panel h3{margin:0;font-size:24px;font-weight:600}
.panel .meta{color:var(--muted);margin:2px 0 12px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:9px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:100px;resize:vertical}
.acts{display:flex;gap:10px;margin-top:14px}
.acts button{flex:1}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.tools{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
.tools button{padding:6px 12px;font-size:13px}
.scroll{overflow:auto;-webkit-overflow-scrolling:touch;height:66vh;min-height:380px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
#size{position:relative}
#tree{position:absolute;left:0;top:0;transform-origin:0 0}
#tree svg{position:absolute;left:0;top:0}
#tree path{fill:none;stroke:var(--line);stroke-width:2;stroke-linejoin:round}
#tree path.ext{stroke-dasharray:5 4}
#tree path.mar{stroke:var(--gold);stroke-width:4}
#tree path.hl{stroke:var(--gold);stroke-width:4}
#tree .p{position:absolute;width:100px;height:112px;padding:8px 4px;margin:0}
#tree .p.anc{border:2px solid var(--gold)}
#tree .av{width:46px;height:46px}
#tree .p .n{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#tree .p .y{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel h4{margin:14px 0 2px;font-size:12px;color:var(--pine);text-transform:uppercase;letter-spacing:.05em}
.panel textarea{min-height:64px}
</style>
</head>

1:["Known as Hank. Polish Catholic, from a working-class family of carpenters.","Grew up in a two-room Gdańsk flat; left school at 13 to apprentice with his father.","Carpenter in Cleveland from 1930. Lost work in 1933 and took factory shifts. Built his family's home by hand.","Married Rosa in 1932; father of Walter and Helen. Quiet, exacting, generous with tools.","Remembered for the house he built, still in the family, and for teaching neighbors carpentry."],

function era(y){return !y?"":y<1920?"Lived through two world wars and the Great Depression.":y<1945?"Childhood shaped by the Great Depression and the Second World War.":y<1970?"Grew up in the postwar boom, the civil rights era and the Cold War.":y<1990?"Came of age in the 1980s and 90s, as the Cold War ended and the internet arrived.":y<2010?"Grew up with the internet, 9/11 and the 2008 financial crisis.":"Born into the smartphone era and the pandemic years."}
function basics(p){var par=(p.par||[]).map(byId).filter(Boolean),sib=people.filter(function(x){return x!==p&&x.par&&p.par&&x.par[0]===p.par[0]});
  return p.name+", born "+(p.born||"in an unknown year")+". Parents: "+(par.map(function(x){return x.name}).join(" and ")||"not yet recorded")+". Siblings: "+(sib.map(function(x){return x.name}).join(", ")||"none recorded")+"."}
function fill(p){if(p.s)return;var x=SEC[p.id]||[],N="Not yet recorded. Tap Edit to add.";
  p.s={b:basics(p)+(x[0]?" "+x[0]:""),e:x[1]||N,c:x[2]||N,p:x[3]||N,h:(era(p.born)+(p.place?" Place: "+p.place+".":"")).trim()||N,g:(p.died?"Died in "+p.died+(p.born?" at age "+(p.died-p.born):"")+". ":"")+(x[4]||N)}}
people.forEach(fill);
var TT=[["b","Basics"],["e","Early life"],["c","Career and achievements"],["p","Personal life"],["h","Historical context"],["g","Legacy"]];
function view(p){return '<p class="meta" style="margin:10px 0 0"><i>'+esc(p.bio)+"</i></p>"+TT.map(function(t){return "<h4>"+t[1]+"</h4><p style=\"margin:0\">"+esc(p.s[t[0]])+"</p>"}).join("")}
function edit(p){return "<label>Summary</label><textarea data-k=\"bio\">"+esc(p.bio)+"</textarea>"+TT.map(function(t){return "<label>"+t[1]+"</label><textarea data-k=\""+t[0]+"\">"+esc(p.s[t[0]])+"</textarea>"}).join("")}

function load(){try{var s=localStorage.getItem("roots-demo3");if(s){var d=JSON.parse(s);if(Array.isArray(d)&&d.length){var sm={};SEED.forEach(function(x){if(x.maiden)sm[x.id]={maiden:x.maiden,origin:x.origin}});d.forEach(function(p){if(!p.maiden&&sm[p.id]){p.maiden=sm[p.id].maiden;p.origin=sm[p.id].origin}});return d}}}catch(e){}return JSON.parse(JSON.stringify(SEED))}
function save(){try{localStorage.setItem("roots-demo3",JSON.stringify(people))}catch(e){}}
function $(i){return document.getElementById(i)}
function yrs(p){return p.born?(p.born+" – "+(p.died||"present")):"Dates unknown"}
function toast(t){var e=$("toast");e.textContent=t;e.className="toast on";setTimeout(function(){e.className="toast"},1800)}
var lastNew=null;
var W=100,G=14,GAP=16,H=112,V=46,sel=null,scale=.8,POS={},TW=0,TH=0;
function nodesOf(){
  var seen={},N=[],of={};
  people.forEach(function(p){
    if(seen[p.id])return;
    var m=[p].concat(people.filter(function(x){return x!==p&&x.unit===p.unit&&!seen[x.id]})).slice(0,2);
    m.sort(function(a,b){return (b.par?1:0)-(a.par?1:0)});
    var n={m:m,kids:[],gen:m[0].gen};
    m.forEach(function(x){seen[x.id]=1;of[x.id]=n});N.push(n)});
  N.forEach(function(n){
    var pm=n.m.filter(function(x){return x.par&&of[x.par[0]]});
    if(pm[0]){n.prim=pm[0];n.up=of[pm[0].par[0]];n.up.kids.push(n)}
    if(pm[1]&&of[pm[1].par[0]]!==n.up){n.ext=pm[1];n.extUp=of[pm[1].par[0]]}});
  N.forEach(function(n){n.kids.sort(function(a,b){return (a.ext?1:0)-(b.ext?1:0)})});
  return N}
function nw(n){return n.m.length*W+(n.m.length-1)*G}
function kw(n){return n.kids.reduce(function(a,c){return a+sw(c)},0)+GAP*Math.max(0,n.kids.length-1)}
function sw(n){n.sw=Math.max(nw(n),kw(n));return n.sw}
function place(n,L){
  var x=L+(n.sw-kw(n))/2;
  n.kids.forEach(function(c){place(c,x);x+=c.sw+GAP});
  n.cx=L+n.sw/2;n.y=n.gen*(H+V)+10}
function render(){
  var N=nodesOf(),R=N.filter(function(n){return !n.up}),L=10,mg=0,svg="",cards="";POS={};
  R.forEach(function(r){sw(r);place(r,L);L+=r.sw+40});
  TW=L-30;
  N.forEach(function(n){
    mg=Math.max(mg,n.gen);
    var x0=n.cx-nw(n)/2;
    n.m.forEach(function(p,i){var x=x0+i*(W+G);POS[p.id]={x:x,y:n.y};
      var mi=marriedIn(p);
      cards+='<button type="button" class="p'+(p.me?" me":"")+(p.id===lastNew?" new":"")+'" data-id="'+p.id+'" style="left:'+x+'px;top:'+n.y+'px"'+(mi?' title="Married in — born into the '+esc(origLabel(p))+'"':"")+'>'+(mi?'<span class="tag" aria-hidden="true">⚭</span>':"")+'<span class="av">'+face(p)+'</span><span class="n serif">'+esc(p.name)+'</span><span class="y">'+esc(p.rel)+'</span><span class="y">'+(p.born||"?")+(p.died?" – "+p.died:"")+"</span></button>"});
    if(n.m.length>1)svg+='<path class="mar" d="M'+(x0+W)+" "+(n.y+32)+"H"+(x0+W+G)+'"/>'});
  N.forEach(function(n){
    [[n.prim,n.up,18],[n.ext,n.extUp,8]].forEach(function(e,k){
      if(!e[0])return;var u=e[1];
      svg+='<path class="'+(k?"ext":"")+'" data-c="'+e[0].id+'" d="M'+u.cx+" "+(u.y+(u.m.length>1?32:H))+"V"+(u.y+H+e[2])+"H"+(POS[e[0].id].x+W/2)+"V"+n.y+'"/>'})});
  TH=(mg+1)*(H+V)+10;
  $("tree").style.cssText="width:"+TW+"px;height:"+TH+"px;transform:scale("+scale+")";
  $("size").style.cssText="width:"+TW*scale+"px;height:"+TH*scale+"px";
  $("tree").innerHTML='<svg width="'+TW+'" height="'+TH+'">'+svg+"</svg>"+cards;
  $("stats").textContent=people.length+" relatives across "+(mg+1)+" generations";
  trace(sel);
}
function anc(id,s){s[id]=1;var p=byId(id);((p&&p.par)||[]).forEach(function(q){anc(q,s)});return s}
function trace(id){
  var s=id?anc(id,{}):{},sv=document.querySelector("#tree svg");
  document.querySelectorAll("#tree .p").forEach(function(b){b.classList.toggle("anc",!!s[b.dataset.id])});
  sv.querySelectorAll("path[data-c]").forEach(function(p){var on=!!s[p.getAttribute("data-c")];p.classList.toggle("hl",on);if(on)sv.appendChild(p)});
}
function setBio(){var b=$("bio");if(!sel){b.style.display="none";return}b.style.display="";b.textContent="Biography: "+byId(sel).name.split(" ")[0]}
function focus(id){var q=POS[id],sc=$("scroll");if(!q)return;sc.scrollTo({left:Math.max(0,(q.x+W/2)*scale-sc.clientWidth/2),top:Math.max(0,q.y*scale-sc.clientHeight/3)})}
function setScale(v){scale=Math.max(.25,Math.min(1.3,v));render()}
$("tree").onclick=function(e){var b=e.target.closest(".p");if(b){sel=+b.dataset.id;trace(sel);setBio()}};
$("scroll").onclick=function(e){if(!e.target.closest(".p")){sel=null;trace(null);setBio()}};
$("bio").onclick=function(){if(sel)openPerson(sel)};
$("zo").onclick=function(){setScale(scale-.15)};
$("zi").onclick=function(){setScale(scale+.15)};
$("all").onclick=function(){setScale(($("scroll").clientWidth-4)/TW)};
$("fit").onclick=function(){var m=people.filter(function(p){return p.me})[0]||people[0];focus(m.id)};
function open(html){$("panel").innerHTML=html;$("sheet").className="sheet on"}
function close(){$("sheet").className="sheet"}
$("sheet").onclick=function(e){if(e.target===$("sheet"))close()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")close()});
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":s;return d.innerHTML}
function face(p){
  if(p.img)return '<img alt="" src="'+p.img+'">';
  var a=p.a||[1,0,"m",0,0],sk=SK[a[0]],hc=HC[a[1]],cl=CL[a[3]],t=a[2],s='<svg viewBox="0 0 64 64" aria-hidden="true">';
  if(t==="l")s+='<path d="M19 28c0-13 6-19 13-19s13 6 13 19v20H19z" fill="'+hc+'"/>';
  if(t==="c")s+='<g fill="'+hc+'"><circle cx="32" cy="16" r="11"/><circle cx="22" cy="23" r="7"/><circle cx="42" cy="23" r="7"/></g>';
  s+='<path d="M8 64c0-13 10-19 24-19s24 6 24 19z" fill="'+cl+'"/><rect x="28" y="38" width="8" height="10" fill="'+sk+'"/><ellipse cx="32" cy="28" rx="11" ry="13" fill="'+sk+'"/>';
  if(t==="m"||t==="u")s+='<path d="M20 27c0-13 7-17 12-17s12 4 12 17c-3-6-8-8-12-8s-9 2-12 8z" fill="'+hc+'"/>';
  if(t==="u")s+='<circle cx="32" cy="8" r="5" fill="'+hc+'"/>';
  if(t==="l")s+='<path d="M21 25c2-8 7-11 11-11s9 3 11 11c-4-4-8-5-11-5s-7 1-11 5z" fill="'+hc+'"/>';
  s+='<circle cx="27" cy="29" r="1.5" fill="#222"/><circle cx="37" cy="29" r="1.5" fill="#222"/><path d="M28 35q4 3 8 0" stroke="#222" stroke-width="1.4" fill="none" stroke-linecap="round"/>';
  if(a[4])s+='<g fill="none" stroke="#222" stroke-width="1.2"><circle cx="27" cy="29" r="4"/><circle cx="37" cy="29" r="4"/><path d="M31 29h2"/></g>';
  return s+"</svg>";
}
function byId(i){return people.filter(function(x){return x.id===i})[0]}
function marriedIn(p){return !!p.maiden}
function origLabel(p){return p.maiden+" family"+(p.origin?" · "+p.origin:"")}
function rnd(n){return Math.floor(Math.random()*n)}
function chips(l,a){if(!a.length)return"";return "<label>"+l+'</label><div class="chips">'+a.map(function(x){return '<button class="ghost chip" data-id="'+x.id+'">'+esc(x.name)+"</button>"}).join("")+"</div>"}
function openPerson(id){
  var p=byId(id);sel=id;trace(id);setBio();
  var par=(p.par||[]).map(byId).filter(Boolean);
  var kin=function(x){return x.id!==p.id&&x.par&&p.par&&x.par[0]===p.par[0]};
  var sib=people.filter(kin);
  var mate=people.filter(function(x){return x.id!==p.id&&x.unit===p.unit&&!kin(x)});
  var kids=people.filter(function(x){return x.par&&x.par.indexOf(p.id)>-1});
  var mi=marriedIn(p);
  open('<div class="top"><span class="av">'+face(p)+'</span><div><h3 class="serif">'+esc(p.name)+'</h3><p class="meta" style="margin:2px 0 0">'+esc(p.rel)+" · "+esc(yrs(p))+(p.place?"<br>"+esc(p.place):"")+'</p>'+(mi?'<p class="origline">⚭ Married in · <button type="button" class="up" id="origfam" style="margin:0">'+esc(origLabel(p))+"</button></p>":"")+'<button class="up" id="pb">Change photo</button><input type="file" id="ph" accept="image/*" hidden></div></div>'+
  chips("Parents",par)+chips("Partner",mate)+chips("Siblings",sib)+chips("Children",kids)+'<div id="bd">'+view(p)+"</div>"+
  '<div class="acts"><button class="ghost" id="cl">Close</button><button id="sv">Edit biography</button></div>');
  if(mi)$("origfam").onclick=function(){toast(p.name.split(" ")[0]+" was born into the "+origLabel(p)+", before marrying into this family.")};
  $("cl").onclick=close;
  $("sv").onclick=function(){
    if(this.textContent==="Edit biography"){$("bd").innerHTML=edit(p);this.textContent="Save biography";return}
    document.querySelectorAll("#bd textarea").forEach(function(t){var k=t.dataset.k;if(k==="bio")p.bio=t.value;else p.s[k]=t.value});
    save();$("bd").innerHTML=view(p);this.textContent="Edit biography";toast("Biography saved")};
  $("pb").onclick=function(){$("ph").click()};
  $("ph").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement("canvas");c.width=c.height=160;var m=Math.min(im.width,im.height);c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);p.img=c.toDataURL("image/jpeg",.75);save();render();openPerson(id);toast("Photo updated")};im.src=r.result};r.readAsDataURL(f)};
  document.querySelectorAll(".chip").forEach(function(b){if(b.dataset.id)b.onclick=function(){openPerson(+b.dataset.id)}});
}
function openAdd(){
  var opts='<option value="">Nobody (start a new branch)</option>'+people.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+"</option>"}).join("");
  open('<h3 class="serif">Add a relative</h3><p class="meta">A portrait is created for them. You can upload a real photo afterward.</p>'+
  '<label for="nm">Full name</label><input id="nm" autocomplete="off">'+
  '<label for="rl">Relationship to you</label><input id="rl" placeholder="Aunt, cousin, grandfather" autocomplete="off">'+
  '<label for="ct">Connect to</label><select id="ct">'+opts+"</select>"+'<label for="as">Add them as</label><select id="as"><option value="child">Child</option><option value="partner">Partner</option></select>'+
  '<div id="mnWrap" style="display:none"><label for="mn">Family name before marriage</label><input id="mn" placeholder="e.g. Whitfield" autocomplete="off">'+
  '<label for="mo">Where that family was from</label><input id="mo" placeholder="e.g. Dayton, Ohio" autocomplete="off"></div>'+
  '<label for="gd">Portrait style</label><select id="gd"><option value="f">Woman</option><option value="m">Man</option></select>'+
  '<label for="by">Year born</label><input id="by" inputmode="numeric" maxlength="4">'+
  '<label for="pl">Place</label><input id="pl" autocomplete="off">'+
  '<label for="sy">Biography</label><textarea id="sy"></textarea>'+
  '<div class="acts"><button class="ghost" id="cl">Cancel</button><button id="ok">Add to tree</button></div>');
  $("cl").onclick=close;
  $("as").onchange=function(){$("mnWrap").style.display=this.value==="partner"?"":"none"};
  $("ok").onclick=function(){
    var nm=$("nm").value.trim();
    if(!nm){toast("Enter a name first");$("nm").focus();return}
    var id=Date.now(),cid=parseInt($("ct").value,10)||0,c=cid?byId(cid):null,as=$("as").value,par=null,unit="u"+id,gen=0;
    if(c&&as==="child"){var mt=people.filter(function(x){return x!==c&&x.unit===c.unit})[0];par=[c.id].concat(mt?[mt.id]:[]);gen=c.gen+1}
    if(c&&as==="partner"){if(people.some(function(x){return x!==c&&x.unit===c.unit})){toast(c.name+" already has a partner");return}unit=c.unit;gen=c.gen}
    lastNew=id;
    var by=parseInt($("by").value,10)||null,w=$("gd").value==="f";
    var o={id:id,name:nm,rel:$("rl").value.trim()||"Relative",born:by,died:null,gen:gen,unit:unit,place:$("pl").value.trim(),bio:$("sy").value.trim()||"No biography yet. Tap to add one.",a:[rnd(5),by&&by<1950?6:rnd(6),w?(rnd(2)?"l":"u"):"m",rnd(6),0]};
    if(par)o.par=par;
    if(as==="partner"){var mn=$("mn").value.trim();if(mn){o.maiden=mn;o.origin=$("mo").value.trim()}}
    fill(o);people.push(o);sel=id;save();close();render();focus(id);setBio();toast(nm+" added")};
}
$("add").onclick=openAdd;
$("inv").onclick=function(){toast("Invite link copied (demo)")};
render();
